<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>

<body>
  <div class="app">
    <button id="themeToggle">🌙 Dark Mode</button>
    <h2>Expense Tracker</h2>

    <div class="container">
      <!-- LEFT -->
      <div class="left">
        <div class="balance">
          <p>Current Balance</p>
          <h1 id="balance">₹0</h1>
        </div>

        <div class="balance">
          <p>This Month</p>
          <h3>Income: ₹<span id="monthIncome">0</span></h3>
          <h3>Expense: ₹<span id="monthExpense">0</span></h3>
        </div>

        <input id="text" placeholder="Description" />
        <input id="amount" type="number" placeholder="Amount" />

        <!-- NEW: Type selector -->
        <div class="type-toggle">
          <label>
            <input type="radio" name="type" value="income" checked />
            Income
          </label>
          <label>
            <input type="radio" name="type" value="expense" />
            Expense
          </label>
        </div>

        <select id="category">
          <option value="">Select Category</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="EMI">EMI</option>
          <option value="Fun">Fun</option>
          <option value="Other">Other</option>
        </select>

        <button onclick="addTransaction()">➕ Add Transaction</button>
        <button onclick="exportCSV()">⬇️ Export CSV</button>


        <ul id="list"></ul>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>
  </div>

<script>
emailjs.init("YOUR_PUBLIC_KEY");
const balanceEl = document.getElementById("balance");
const list = document.getElementById("list");
const text = document.getElementById("text");
const amountInput = document.getElementById("amount");
const category = document.getElementById("category");
const themeToggle = document.getElementById("themeToggle");

let transactions = JSON.parse(localStorage.getItem("transactions")) || [];
let chart;

const categoryColors = {
  Food: "#22c55e",
  Travel: "#3b82f6",
  EMI: "#ef4444",
  Fun: "#eab308",
  Other: "#8b5cf6"
};

/* THEME */
if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
  themeToggle.innerText = "☀️ Light Mode";
}

themeToggle.onclick = () => {
  document.body.classList.toggle("dark");
  const dark = document.body.classList.contains("dark");
  localStorage.setItem("theme", dark ? "dark" : "light");
  themeToggle.innerText = dark ? "☀️ Light Mode" : "🌙 Dark Mode";
};

/* ADD TRANSACTION */
function addTransaction() {
  const textVal = text.value.trim();
  const amountVal = Number(amountInput.value);
  const catVal = category.value;
  const type = document.querySelector('input[name="type"]:checked').value;

  if (!textVal || !amountVal || !catVal) {
    alert("Please fill all fields");
    return;
  }

  const finalAmount = type === "expense" ? -amountVal : amountVal;

  // 🔔 STEP 6: Send email ONLY for expenses
if (type === "expense") {
  emailjs.send(
    "service_5c74smz",
    "template_iihn07o",
    {
      to_email: "vraj53009@gmail.com",
      amount: amountVal,
      category: catVal,
      description: textVal,
      date: new Date().toLocaleString()
    }
  )
  .then(() => {
    console.log("Expense email sent");
  })
  .catch((error) => {
    console.error("Email failed:", error);
  });
}


  transactions.push({
    id: Date.now(),
    text: textVal,
    amount: finalAmount,
    category: catVal,
    date: new Date().toISOString()
  });

  localStorage.setItem("transactions", JSON.stringify(transactions));
  text.value = amountInput.value = category.value = "";
  updateUI();
}

/* UI */
function updateUI() {
  list.innerHTML = "";
  let total = 0;

  transactions.forEach(txn => {
    total += txn.amount;

    const li = document.createElement("li");
    li.className = txn.amount < 0 ? "expense" : "income";
    li.style.borderLeftColor = categoryColors[txn.category];

    li.innerHTML = `
  <div class="txn-left">
    <strong>${txn.text}</strong><br>
    <small>${txn.category}</small>
  </div>

  <div class="txn-right">
    <span class="amount">₹${txn.amount}</span>
    <button class="delete-btn" onclick="deleteTransaction(${txn.id})" title="Delete">
      🗑️
    </button>
  </div>
`;


    list.appendChild(li);
  });

  balanceEl.innerText = `₹${total}`;
  updateMonthlySummary();
  updateChart();
}

/* MONTH SUMMARY */
function updateMonthlySummary() {
  const now = new Date();
  let income = 0, expense = 0;

  transactions.forEach(txn => {
    const d = new Date(txn.date);
    if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
      txn.amount > 0 ? income += txn.amount : expense += txn.amount;
    }
  });

  monthIncome.innerText = income;
  monthExpense.innerText = Math.abs(expense);
}

/* CHART */
function updateChart() {
  const map = {};
  transactions.forEach(txn => {
    if (txn.amount < 0) {
      map[txn.category] = (map[txn.category] || 0) + Math.abs(txn.amount);
    }
  });

  if (chart) chart.destroy();

  chart = new Chart(expenseChart, {
    type: "pie",
    data: {
      labels: Object.keys(map),
      datasets: [{
        data: Object.values(map),
        backgroundColor: Object.keys(map).map(k => categoryColors[k])
      }]
    }
  });
}

updateUI();
function deleteTransaction(id) {
  transactions = transactions.filter(txn => txn.id !== id);
  localStorage.setItem("transactions", JSON.stringify(transactions));
  updateUI();
}

function exportCSV() {
  if (!transactions.length) {
    alert("No transactions to export");
    return;
  }

  const headers = ["Date", "Description", "Category", "Amount"];
  const rows = transactions.map(txn => [
    new Date(txn.date).toLocaleDateString(),
    txn.text,
    txn.category,
    txn.amount
  ]);

  let csvContent = headers.join(",") + "\n";
  rows.forEach(row => {
    csvContent += row.join(",") + "\n";
  });

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "expense-tracker.csv";
  link.click();

  URL.revokeObjectURL(url);
}

</script>
</body>
</html>
